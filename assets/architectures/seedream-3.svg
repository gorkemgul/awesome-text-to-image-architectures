<text x="560" y="302.0" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">modality RoPE, a defect-aware data</text>
<text x="560" y="328.0" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">pipeline and a DINOv2-based</text>
<text x="560" y="354.0" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">representation-alignment loss</text>
<text x="560" y="304.0" text-anchor="middle" font-size="14" fill="#64748b">generation</text>
