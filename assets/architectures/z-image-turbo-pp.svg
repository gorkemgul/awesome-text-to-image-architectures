<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="444" viewBox="0 0 1120 444" role="img" aria-labelledby="title desc">
<title id="title">Z-Image Turbo++: documented inputs and outputs</title>
<desc id="desc">Editorial interface diagram. Internal architecture and per-task modality combinations are not shown. See the model notes and primary sources.</desc>
<rect width="1120" height="100%" rx="18" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="42" y="33" font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">DOCUMENTED INTERFACE · EDITORIAL DIAGRAM</text>
<text x="42" y="76" font-size="32" font-weight="700" fill="#0f172a">Z-Image Turbo++</text>
<rect x="365" y="140.0" width="390" height="194" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="560" y="177.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#64748b">MODEL / SYSTEM</text>
<text x="560" y="107.0" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">2-step distillation of the 8-step</text>
<text x="560" y="133.0" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Z-Image Turbo teacher using step-</text>
<text x="560" y="159.0" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">decoupled parameterization —</text>
<text x="560" y="185.0" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">independent weights per denoising</text>
<text x="560" y="211.0" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">step, both initialized from the</text>
<text x="560" y="237.0" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">teacher — combined with</text>
<text x="560" y="263.0" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">distribution-aligned adversarial</text>
<text x="560" y="289.0" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">training against teacher-generated</text>
<text x="560" y="315.0" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">(rather than external real) images</text>
<text x="560" y="341.0" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">and end-to-end training with an</text>
<text x="560" y="367.0" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">explicit step-1 loss</text>
<text x="560" y="304.0" text-anchor="middle" font-size="14" fill="#64748b">generation</text>
<text x="42" y="122" font-size="13" font-weight="700" letter-spacing="2" fill="#0369a1">INPUTS</text>
<rect x="42" y="219.0" width="236" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="56" y="243.0" font-size="17" fill="#0369a1">Text</text>
<text x="842" y="122" font-size="13" font-weight="700" letter-spacing="2" fill="#047857">OUTPUTS</text>
<rect x="842" y="219.0" width="236" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="856" y="243.0" font-size="17" fill="#047857">Images</text>
<path d="M292 237.0 H346 M337 230.0 L347 237.0 L337 244.0" fill="none" stroke="#0369a1" stroke-width="2.5"/>
<path d="M773 237.0 H827 M818 230.0 L828 237.0 L818 244.0" fill="none" stroke="#047857" stroke-width="2.5"/>
<text x="42" y="407" font-size="15" fill="#64748b">Input/output summary; internal architecture is not shown. Task and variant limits apply.</text>
</g></svg>
