<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">GLIDE architecture</title>
<desc id="desc">Source-based reconstruction. Sec. 3.1: base ADM U-Net with jointly trained width-2048 text transformer; final token replaces class embedding and token sequence augments attention context. Separate width-1024 text encoder conditions 64-to-256 diffusion upsampler. Sec. 4.1 inpainting uses masked RGB and mask channels.</desc>
