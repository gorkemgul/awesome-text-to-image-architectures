<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">SDXL-Lightning architecture</title>
<desc id="desc">Source-based reconstruction. Sec. 3.2-3.6: progressive adversarial distillation; discriminator is SDXL U-Net encoder and mid-block; 128-to-32 MSE then 32-to-8-to-4-to-2-to-1 adversarial stages. Inference uses distilled SDXL U-Net and VAE.</desc>
