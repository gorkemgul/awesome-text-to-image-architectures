<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">Seedream 3.0 architecture</title>
<desc id="desc">Source-based reconstruction. Secs. 2.2.1-2.2.2: inherited MMDiT, size conditioning, cross-modality 2D RoPE, flow matching, DINOv2-L feature alignment; Sec. 2.3 no separate refiner. Unspecified encoder/decoder identities omitted. Seedream 2.0 Sec. 3.1 (https://arxiv.org/abs/2503.07703) documents self-developed VAE; Seedream 3.0 Sec. 2.2.1 explicitly inherits this core.</desc>
