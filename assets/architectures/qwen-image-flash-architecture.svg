<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">Qwen-Image-Flash architecture</title>
<desc id="desc">Source-based reconstruction. Secs. 3.1-3.2 define conditional vector field and DMD student; Sec. 4.3 uses base teacher for first 3 steps and 50:50 base/RL teacher on step 4; Sec. 4.4 jointly distills T2I and editing. Encoder/decoder identities are not specified and not invented.</desc>
